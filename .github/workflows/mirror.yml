on:
  push:
    branches: [ main ] # Triggers on commits to main
  pull_request:
    types: [opened, synchronize, reopened] # Triggers on PR updates

jobs:
  mirror_to_org:
    runs-on: ubuntu-latest
    steps:
      - name: Create bare clone of source
        run: |
          git clone --bare https://github.com/nisar-solid/ATBD.git source-repo.git

      - name: Push mirror to Organization and Gitlab
        run: |
          cd source-repo.git
          git push https://${{ secrets.NISAR_TOKEN }}@github.com/NISAR-Science-Algorithms/NISAR_SolidEarth.git main:main

      - name: Push mirror to GitLab
        working-directory: source-repo.git
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@gitlab.com/nisar-science-algorithms/solid-earth/ATBD.git" main:main
